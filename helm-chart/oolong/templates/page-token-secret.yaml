{{- if and .Values.pageTokenSecret.create (not .Values.pageTokenSecret.existingSecret) }}
{{- $name := include "oolong.pageTokenSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if not $existing }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "oolong.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{ .Values.pageTokenSecret.secretKey }}: {{ .Values.pageTokenSecret.value | default (randAlphaNum 64) | quote }}
{{- end }}
{{- end }}
