{{- if and .Values.pageTokenSecret.create (not .Values.pageTokenSecret.existingSecret) }}
{{- $name := include "oolong.pageTokenSecretName" . }}
{{- $key := .Values.pageTokenSecret.secretKey }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing (not (hasKey $existing.data $key)) }}
{{- fail (printf "pageTokenSecret.secretKey %q is missing from existing Secret %s; add the key or revert secretKey" $key $name) }}
{{- end }}
{{- if and (not $existing) (not .Values.pageTokenSecret.value) }}
{{- /* first install: randAlphaNum via stringData below */}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "oolong.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
{{- if $existing }}
data:
  {{ $key }}: {{ index $existing.data $key }}
{{- else }}
stringData:
  {{ $key }}: {{ .Values.pageTokenSecret.value | default (randAlphaNum 64) | quote }}
{{- end }}
{{- end }}
