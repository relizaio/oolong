{{- if and .Values.gitPod.enabled .Values.persistence.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "oolong.fullname" . }}-git-script
  labels:
    {{- include "oolong.labels" . | nindent 4 }}
    app.kubernetes.io/component: git
data:
  git-sync.sh: |
    #!/bin/sh
    set -e

    echo "Starting Git sync script..."

    if [ -z "$GIT_REPO_URL" ]; then
      echo "ERROR: GIT_REPO_URL environment variable is not set"
      exit 1
    fi

    CONTENT_DIR="${CONTENT_DIR:-/content}"
    WORK_DIR="${CONTENT_DIR}/_work"
    REVISIONS_DIR="${CONTENT_DIR}/revisions"
    POINTER_FILE="${CONTENT_DIR}/.oolong-current-revision"
    SYNC_INTERVAL="${SYNC_INTERVAL:-60}"
    GIT_BRANCH="${GIT_BRANCH:-main}"
    REVISION_RETENTION_COUNT="${REVISION_RETENTION_COUNT:-{{ .Values.gitPod.revisionRetentionCount | default 5 }}}"

    echo "Configuration:"
    echo "  Repository: $GIT_REPO_URL"
    echo "  Content Directory: $CONTENT_DIR"
    echo "  Work Directory: $WORK_DIR"
    echo "  Branch: $GIT_BRANCH"
    echo "  Sync Interval: ${SYNC_INTERVAL}s"
    echo "  Revision retention: ${REVISION_RETENTION_COUNT}"

    git config --global --add safe.directory "$WORK_DIR"

    mkdir -p "$REVISIONS_DIR"

    if [ ! -d "$WORK_DIR/.git" ]; then
      echo "Cloning repository into work directory..."
      rm -rf "$WORK_DIR"
      git clone --branch "$GIT_BRANCH" "$GIT_REPO_URL" "$WORK_DIR"
    fi

    . /scripts/git-publish.inc.sh

    cd "$WORK_DIR"
    publish_revision

    echo "Starting sync loop..."
    while true; do
      echo "$(date '+%Y-%m-%d %H:%M:%S') - Pulling latest changes..."
      if git pull origin "$GIT_BRANCH"; then
        publish_revision
        echo "$(date '+%Y-%m-%d %H:%M:%S') - Pull successful"
      else
        echo "$(date '+%Y-%m-%d %H:%M:%S') - Pull failed, will retry"
      fi
      sleep "$SYNC_INTERVAL"
    done
  git-publish.inc.sh: |
{{ .Files.Get "scripts/git-publish.inc.sh" | nindent 4 }}
{{- end }}
