{{- if and .Values.gitPod.enabled .Values.persistence.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "oolong.fullname" . }}-git-script
  labels:
    {{- include "oolong.labels" . | nindent 4 }}
    app.kubernetes.io/component: git
data:
  git-sync.sh: |
    #!/bin/sh
    set -e

    echo "Starting Git sync script..."

    if [ -z "$GIT_REPO_URL" ]; then
      echo "ERROR: GIT_REPO_URL environment variable is not set"
      exit 1
    fi

    CONTENT_DIR="${CONTENT_DIR:-/content}"
    WORK_DIR="${CONTENT_DIR}/_work"
    REVISIONS_DIR="${CONTENT_DIR}/revisions"
    POINTER_FILE="${CONTENT_DIR}/.oolong-current-revision"
    SYNC_INTERVAL="${SYNC_INTERVAL:-60}"
    GIT_BRANCH="${GIT_BRANCH:-main}"
    REVISION_RETENTION_COUNT="${REVISION_RETENTION_COUNT:-{{ .Values.gitPod.revisionRetentionCount | default 5 }}}"

    echo "Configuration:"
    echo "  Repository: $GIT_REPO_URL"
    echo "  Content Directory: $CONTENT_DIR"
    echo "  Work Directory: $WORK_DIR"
    echo "  Branch: $GIT_BRANCH"
    echo "  Sync Interval: ${SYNC_INTERVAL}s"
    echo "  Revision retention: ${REVISION_RETENTION_COUNT}"

    git config --global --add safe.directory "$WORK_DIR"

    mkdir -p "$REVISIONS_DIR"

    if [ ! -d "$WORK_DIR/.git" ]; then
      echo "Cloning repository into work directory..."
      rm -rf "$WORK_DIR"
      git clone --branch "$GIT_BRANCH" "$GIT_REPO_URL" "$WORK_DIR"
    fi

    revision_complete() {
      TARGET="$1"
      [ -d "$TARGET" ] && [ -d "$TARGET/products" ]
    }

    prune_old_revisions() {
      KEEP="$REVISION_RETENTION_COUNT"
      [ "$KEEP" -gt 0 ] || return 0
      TO_PRUNE="$(ls -1dt "$REVISIONS_DIR"/*/ 2>/dev/null | tail -n +"$((KEEP + 1))" || true)"
      if [ -z "$TO_PRUNE" ]; then
        return 0
      fi
      for DIR in $TO_PRUNE; do
        case "$DIR" in
          */.staging-*|*/.*) continue ;;
        esac
        echo "Pruning old revision directory $DIR"
        rm -rf "$DIR"
      done
    }

    publish_revision() {
      cd "$WORK_DIR"
      SHA="$(git rev-parse HEAD)"
      TARGET="$REVISIONS_DIR/$SHA"
      STAGING="$REVISIONS_DIR/.staging-$SHA"

      if revision_complete "$TARGET"; then
        echo "Revision $SHA already published"
      else
        echo "Publishing immutable revision $SHA"
        rm -rf "$STAGING"
        mkdir -p "$STAGING"
        if ! find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec cp -a {} "$STAGING/" \; ; then
          echo "ERROR: failed to copy content for revision $SHA"
          rm -rf "$STAGING"
          return 1
        fi
        if ! revision_complete "$STAGING"; then
          echo "ERROR: published tree for $SHA is missing products/"
          rm -rf "$STAGING"
          return 1
        fi
        rm -rf "$TARGET"
        mv "$STAGING" "$TARGET"
      fi

      printf '%s' "$SHA" > "${POINTER_FILE}.new"
      mv "${POINTER_FILE}.new" "$POINTER_FILE"
      echo "Active content revision is $SHA"
      prune_old_revisions
    }

    cd "$WORK_DIR"
    publish_revision

    echo "Starting sync loop..."
    while true; do
      echo "$(date '+%Y-%m-%d %H:%M:%S') - Pulling latest changes..."
      if git pull origin "$GIT_BRANCH"; then
        publish_revision
        echo "$(date '+%Y-%m-%d %H:%M:%S') - Pull successful"
      else
        echo "$(date '+%Y-%m-%d %H:%M:%S') - Pull failed, will retry"
      fi
      sleep "$SYNC_INTERVAL"
    done
{{- end }}
