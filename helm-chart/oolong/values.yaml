# Default values for oolong chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

# Required. The published 25.10.6 image does not implement /healthz or git
# snapshot reload. Set a build from this branch, for example oolong-server:local.
# Leave empty to fail helm install/upgrade until an explicit compatible image is set.
image: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""


podAnnotations: {}

podSecurityContext:
  fsGroup: 10001

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 10001

service:
  type: ClusterIP
  port: 3000

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

# Persistent Volume Claim
persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 2Gi
  storageClass: ""

# Git pod configuration
gitPod:
  enabled: false
  image: alpine/git:2.49.1@sha256:94b40c2135951103e0c5c7db07ae4cf6e935644a717e05d17f0c540db47683af
  imagePullPolicy: IfNotPresent
  # Mount path for the shared volume
  mountPath: /content
  # Resources for the git pod
  resources: {}
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 50m
    #   memory: 64Mi
  # Git repository configuration
  repoUrl: ""  # Public https:// Git URL (required when gitPod.enabled is true)
  # Optional exact-match hostname allowlist. Empty allows any https host.
  # Hostname checks do not follow DNS changes or Git redirects; restrict
  # Git-pod egress with a NetworkPolicy or cluster egress control.
  allowedHosts: []
  branch: "main"  # Git branch to sync
  syncInterval: "60"  # Sync interval in seconds
  # Server polls for new revisions when git sync is enabled (milliseconds).
  contentReloadIntervalMs: 60000
  # Immutable revision directories kept on the content PVC (oldest pruned after publish).
  # Integer 1-1000, passed as REVISION_RETENTION_COUNT. Not interpolated into shell.
  revisionRetentionCount: 5
  # Security context for git pod
  securityContext:
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: false
    runAsNonRoot: true
    runAsUser: 10001
  # Additional environment variables for git pod
  env: {}

# Pagination token HMAC key (required unless PAGE_TOKEN_DEV_FALLBACK=true and
# NODE_ENV is not production). The chart never sets that opt-in.
# Default: chart creates <release-fullname>-page-token (re-rendered on upgrade with the
# existing encoded value; not rotated automatically). Set existingSecret to BYO instead.
pageTokenSecret:
  create: true
  existingSecret: ""
  secretKey: PAGE_TOKEN_SECRET
  # Optional fixed value on first install when create=true and existingSecret is empty.
  # Leave empty to generate a random value once.
  value: ""

# Environment variables
env:
  API_VERSION: "v1.0.0"
  SERVER_HOST: "http://localhost:3000"
  DEBUG_MODE: "false"  # Set to "true" to enable verbose debug logging
  # CONTENT_RELOAD_INTERVAL_MS is set automatically when gitPod.enabled and persistence are on.

# Health check configuration
healthcheck:
  enabled: true
  path: "/.well-known/tea"
  livenessPath: "/healthz"
  readinessPath: "/.well-known/tea"
  initialDelaySeconds: 15
  periodSeconds: 30
  timeoutSeconds: 10
  successThreshold: 1
  failureThreshold: 3

# Traefik ingress configuration
useTraefikLe: false
traefikBehindLb: false
ingressHost: oolong.localhost
servicePort: 3000
useTraefikDevelopment: false