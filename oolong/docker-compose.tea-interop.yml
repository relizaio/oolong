services:
  oolong-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3005:3000"
    volumes:
      - ./fixtures/tea-1.0.0:/app/src/content:ro
    environment:
      - API_VERSION=v1.0.0
      - SERVER_HOST=http://127.0.0.1:3005
      - CONTENT_DIR=/app/src/content
      - TEA_SPEC_COMMIT=962a0228af1bfcc1232ac3f79239317ff33fdb04
    healthcheck:
      test: ["CMD", "node", "tea-ready.js"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
