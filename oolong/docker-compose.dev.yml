services:
  oolong-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3005:3000"
    volumes:
      - ./fixtures/tea-1.0.0:/app/src/content:ro
    environment:
      - NODE_ENV=development
      - API_VERSION=v1.0.0
      - SERVER_HOST=http://127.0.0.1:3005
      - CONTENT_DIR=/app/src/content
